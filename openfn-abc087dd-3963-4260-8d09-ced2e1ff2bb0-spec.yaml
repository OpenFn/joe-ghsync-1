name: joe-ghsync-v1
description: |
  Testing V1 GH sync

collections: null
channels: null
credentials: null
workflows:
  cron-thing:
    name: cron thing
    jobs:
      "x":
        name: 'x'
        adaptor: '@openfn/language-common@latest'
        credential: null
        body: |
          fn((s) => s);

    triggers:
      cron:
        type: cron
        cron_expression: '0 0 * * *'
        cron_cursor_job: 'x'
        enabled: false
    edges:
      cron->x:
        source_trigger: cron
        target_job: 'x'
        condition_type: always
        enabled: true
  my-workflow:
    name: my workflow
    jobs:
      "A":
        name: 'A'
        adaptor: '@openfn/language-langfuse@1.0.0'
        credential: null
        body: |
          log($.data) // v7 maybe?

    triggers:
      webhook:
        type: webhook
        webhook_reply: before_start
        enabled: false
    edges:
      webhook->A:
        source_trigger: webhook
        target_job: 'A'
        condition_type: always
        enabled: true
